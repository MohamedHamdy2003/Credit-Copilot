name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: credit_copilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U copilot -d credit_copilot_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://copilot:ci_test_password@localhost:5432/credit_copilot_test
      TEST_DATABASE_URL: postgresql://copilot:ci_test_password@localhost:5432/credit_copilot_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm evaluate:offline
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm evaluate:core:offline
      - run: pnpm evaluate --offline-agents
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact --no-banner
