services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: credit_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copilot -d credit_copilot']
      interval: 3s
      timeout: 3s
      retries: 20
  ollama:
    profiles: ['local-llm']
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_NO_CLOUD: '1'
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_models:/root/.ollama
volumes:
  postgres_data:
  ollama_models:
