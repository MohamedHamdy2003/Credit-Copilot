<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Copilot — Policy Ingestion &amp; Vector DB Walkthrough</title>
    <style>
      :root {
        --bg-outer: #071915;
        --bg-stage-1: #0b2620;
        --bg-stage-2: #10372e;
        --ink: #eefaf5;
        --ink-soft: #bfe0d4;
        --muted: #82b3a3;
        --emerald: #1c856a;
        --emerald-bright: #4cd29d;
        --teal-bright: #5ad2e6;
        --amber-bright: #f5c26b;
        --red-bright: #ff8a7d;
        --card-bg: rgba(8, 28, 23, 0.72);
        --card-border: rgba(110, 231, 191, 0.22);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --sans: Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg-outer);
        -webkit-font-smoothing: antialiased;
      }

      /* Fullscreen-friendly deck wrapper */
      .deck {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 20px 64px;
        background:
          radial-gradient(circle at 14% 12%, rgba(36, 152, 121, 0.24), transparent 42%),
          radial-gradient(circle at 86% 86%, rgba(45, 169, 190, 0.2), transparent 44%),
          var(--bg-outer);
      }

      .stage {
        position: relative;
        width: min(100%, 1400px);
        height: min(100%, 780px);
        border-radius: 20px;
        background:
          radial-gradient(circle at 76% 20%, rgba(56, 193, 152, 0.16), transparent 44%),
          radial-gradient(circle at 18% 82%, rgba(36, 146, 165, 0.14), transparent 46%),
          linear-gradient(140deg, var(--bg-stage-1) 0%, var(--bg-stage-2) 55%, #0c2b24 100%);
        border: 1px solid rgba(118, 224, 188, 0.2);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        padding: 22px 32px 20px;
        display: grid;
        grid-template-rows: auto minmax(0, 1.32fr) minmax(0, 0.86fr);
        gap: 14px;
        overflow: hidden;
      }

      /* Top Header */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }

      .brand-block {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }

      .title-wrap {
        min-width: 0;
      }

      .step-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--emerald-bright);
        margin-bottom: 3px;
      }

      .step-eyebrow::before {
        content: '';
        width: 14px;
        height: 2px;
        border-radius: 2px;
        background: var(--emerald-bright);
      }

      .slide-title {
        margin: 0;
        font-size: clamp(20px, 2.2vw, 28px);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: #f4fcf9;
        transition: opacity 0.2s ease;
      }

      /* Top stage jump pills */
      .stage-pills {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .stage-pill {
        appearance: none;
        border: 1px solid rgba(139, 224, 194, 0.22);
        background: rgba(255, 255, 255, 0.05);
        color: #b4dbd0;
        border-radius: 999px;
        padding: 5px 11px;
        font: inherit;
        font-size: 11.5px;
        font-weight: 650;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          transform 0.15s ease;
      }

      .stage-pill:hover {
        background: rgba(76, 210, 157, 0.14);
        border-color: rgba(110, 231, 191, 0.5);
        color: #fff;
      }

      .stage-pill.is-active {
        background: #176753;
        border-color: #6ee7bf;
        color: #ffffff;
        box-shadow: 0 0 0 3px rgba(76, 210, 157, 0.18);
      }

      /* Giant Persistent Master Diagram Canvas */
      .diagram-shell {
        position: relative;
        min-height: 0;
        border-radius: 16px;
        background:
          radial-gradient(circle at 50% 50%, rgba(28, 118, 94, 0.18), transparent 68%),
          rgba(6, 21, 17, 0.62);
        border: 1px solid rgba(110, 231, 191, 0.2);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .diagram-hint {
        position: absolute;
        top: 10px;
        right: 14px;
        font-size: 11px;
        color: rgba(154, 214, 194, 0.72);
        font-family: var(--mono);
        pointer-events: none;
      }

      .master-svg {
        width: 100%;
        height: 100%;
        max-height: 100%;
        display: block;
      }

      /* Interactive SVG Spotlight & Magic-Move Transitions */
      .diag-node {
        cursor: pointer;
        transition:
          opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.42s ease;
        transform-box: fill-box;
        transform-origin: center;
      }

      .diag-node:hover {
        filter: brightness(1.08);
      }

      .diag-wire {
        transition:
          opacity 0.42s ease,
          stroke-width 0.35s ease;
      }

      .spotlight-ring {
        opacity: 0;
        transition: opacity 0.38s ease;
        pointer-events: none;
      }

      /* Dim non-focused nodes when a spotlight slide is active */
      .master-svg[data-focus]:not([data-focus='overview']) .diag-node {
        opacity: 0.24;
      }

      .master-svg[data-focus]:not([data-focus='overview']) .diag-wire {
        opacity: 0.16;
      }

      .master-svg[data-focus]:not([data-focus='overview']) .pipeline-frame {
        opacity: 0.42;
      }

      /* Highlight the focused node */
      .master-svg[data-focus='sources'] .node-sources,
      .master-svg[data-focus='extract'] .node-extract,
      .master-svg[data-focus='chunk'] .node-chunk,
      .master-svg[data-focus='embed'] .node-embed,
      .master-svg[data-focus='index'] .node-index,
      .master-svg[data-focus='vectordb'] .node-vectordb {
        opacity: 1;
        transform: scale(1.045);
        filter: drop-shadow(0 0 18px rgba(76, 210, 157, 0.42));
      }

      .master-svg[data-focus='vectordb'] .node-vectordb {
        filter: drop-shadow(0 0 20px rgba(90, 210, 230, 0.46));
      }

      .master-svg[data-focus='sources'] .node-sources .spotlight-ring,
      .master-svg[data-focus='extract'] .node-extract .spotlight-ring,
      .master-svg[data-focus='chunk'] .node-chunk .spotlight-ring,
      .master-svg[data-focus='embed'] .node-embed .spotlight-ring,
      .master-svg[data-focus='index'] .node-index .spotlight-ring,
      .master-svg[data-focus='vectordb'] .node-vectordb .spotlight-ring {
        opacity: 1;
      }

      /* Highlight wires leading into / out of the focused stage */
      .master-svg[data-focus='sources'] .wire-src-ext,
      .master-svg[data-focus='sources'] .wire-blocked,
      .master-svg[data-focus='extract'] .wire-src-ext,
      .master-svg[data-focus='extract'] .wire-blocked,
      .master-svg[data-focus='extract'] .wire-ext-chk,
      .master-svg[data-focus='chunk'] .wire-ext-chk,
      .master-svg[data-focus='chunk'] .wire-chk-emb,
      .master-svg[data-focus='embed'] .wire-chk-emb,
      .master-svg[data-focus='embed'] .wire-emb-idx,
      .master-svg[data-focus='index'] .wire-emb-idx,
      .master-svg[data-focus='index'] .wire-idx-db,
      .master-svg[data-focus='vectordb'] .wire-idx-db {
        opacity: 1;
      }

      /* Keep the pipeline container slightly brighter when inspecting an internal stage */
      .master-svg[data-focus='extract'] .pipeline-frame,
      .master-svg[data-focus='chunk'] .pipeline-frame,
      .master-svg[data-focus='embed'] .pipeline-frame,
      .master-svg[data-focus='index'] .pipeline-frame {
        opacity: 0.85;
      }

      /* Subtle animations */
      @keyframes dashFlow {
        from {
          stroke-dashoffset: 36;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      .flow-anim {
        stroke-dasharray: 8 7;
        animation: dashFlow 1.25s linear infinite;
      }
      .flow-anim-slow {
        stroke-dasharray: 7 7;
        animation: dashFlow 1.8s linear infinite;
      }

      @keyframes ringPulse {
        0%,
        100% {
          stroke-opacity: 0.95;
          stroke-width: 2.6;
        }
        50% {
          stroke-opacity: 0.35;
          stroke-width: 4.2;
        }
      }
      .spotlight-ring {
        animation: ringPulse 2s ease-in-out infinite;
      }

      /* Bottom Focus Detail Drawer */
      .detail-panel {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 11px;
        animation: panelReveal 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes panelReveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .detail-lead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }

      .detail-lead p {
        margin: 0;
        font-size: 13.8px;
        line-height: 1.45;
        color: var(--ink-soft);
        max-width: 920px;
      }

      .detail-tag {
        flex: none;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 700;
        padding: 5px 11px;
        border-radius: 999px;
        background: rgba(76, 210, 157, 0.14);
        border: 1px solid rgba(110, 231, 191, 0.34);
        color: #8df0ca;
        white-space: nowrap;
      }

      .detail-cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
        flex: 1;
        min-height: 0;
      }

      .detail-cards.is-four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .d-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 13px;
        padding: 13px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
      }

      .d-card.is-teal {
        border-color: rgba(90, 210, 230, 0.34);
        background: rgba(10, 34, 42, 0.68);
      }

      .d-card.is-amber {
        border-color: rgba(245, 194, 107, 0.32);
        background: rgba(42, 31, 12, 0.56);
      }

      .d-card.is-red {
        border-color: rgba(255, 138, 125, 0.34);
        background: rgba(48, 18, 16, 0.6);
      }

      .d-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .d-card h3 {
        margin: 0;
        font-size: 13.8px;
        font-weight: 750;
        color: #f4fcf9;
      }

      .d-card-badge {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #8ee5c4;
        white-space: nowrap;
      }

      .d-card.is-teal .d-card-badge {
        color: #8ee6f5;
      }
      .d-card.is-amber .d-card-badge {
        color: #fbd48c;
      }
      .d-card.is-red .d-card-badge {
        color: #ffada4;
      }

      .d-card p {
        margin: 0;
        font-size: 12.4px;
        line-height: 1.48;
        color: #c2dfd5;
      }

      .d-card code {
        font-family: var(--mono);
        font-size: 11.2px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        color: #8df0ca;
      }

      .d-card-foot {
        margin-top: auto;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-family: var(--mono);
        font-size: 11px;
        color: #8ec9b6;
        overflow-wrap: anywhere;
      }

      /* Progress bar */
      .progress-rail {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #27a37e, #5ad2e6);
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Bottom Presenter Controls */
      .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(9, 30, 25, 0.92);
        border: 1px solid rgba(139, 224, 194, 0.26);
        backdrop-filter: blur(12px);
        color: #dff5ed;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
      }

      .nav-btn {
        width: 31px;
        height: 31px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: #eefaf5;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      .nav-btn:hover:not(:disabled) {
        background: #176753;
        border-color: #6ee7bf;
      }

      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot-btn {
        width: 9px;
        height: 9px;
        padding: 0;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 255, 255, 0.26);
        cursor: pointer;
        transition:
          width 0.22s ease,
          background 0.22s ease;
      }

      .dot-btn.is-active {
        width: 24px;
        background: #4cd29d;
      }

      .dot-btn:hover:not(.is-active) {
        background: rgba(255, 255, 255, 0.55);
      }

      .counter {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: #a9d9c8;
        min-width: 52px;
        text-align: center;
      }

      @media (max-width: 1020px) {
        .stage {
          padding: 16px;
          grid-template-rows: auto auto 1fr;
          overflow-y: auto;
        }
        .detail-cards,
        .detail-cards.is-four {
          grid-template-columns: 1fr;
        }
        .stage-pills {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="deck" aria-label="Credit Copilot Ingestion and Vector DB Spotlight Presentation">
      <div class="stage">
        <!-- ======================================================= -->
        <!-- TOP HEADER + STAGE PILLS                                -->
        <!-- ======================================================= -->
        <header class="topbar">
          <div class="brand-block">
            <svg width="40" height="40" viewBox="0 0 36 36" fill="none" aria-hidden="true">
              <rect width="36" height="36" rx="10" fill="#176753" />
              <path d="M18 7L29 12.5H7L18 7Z" fill="#E8F7F1" />
              <rect x="8.5" y="14" width="19" height="1.8" rx="0.9" fill="#9EE2C8" />
              <rect x="10.2" y="17.2" width="2.4" height="8.8" rx="0.8" fill="#E8F7F1" />
              <rect x="16.8" y="17.2" width="2.4" height="8.8" rx="0.8" fill="#E8F7F1" />
              <rect x="23.4" y="17.2" width="2.4" height="8.8" rx="0.8" fill="#E8F7F1" />
              <rect x="7" y="27.2" width="22" height="2.3" rx="1.15" fill="#4CD29D" />
            </svg>
            <div class="title-wrap">
              <div class="step-eyebrow" id="stepEyebrow">STEP 01 OF 07 · FULL ARCHITECTURE</div>
              <h1 class="slide-title" id="slideTitle">Policy Ingestion &amp; Vector Database Overview</h1>
            </div>
          </div>

          <div class="stage-pills" id="stagePills" role="tablist" aria-label="Focus stage"></div>
        </header>

        <!-- ======================================================= -->
        <!-- GIANT PERSISTENT MASTER ARCHITECTURE DIAGRAM            -->
        <!-- ======================================================= -->
        <section class="diagram-shell" aria-label="Interactive Policy Ingestion and Vector DB Diagram">
          <span class="diagram-hint">Click any block to focus · ← / → keys · F fullscreen</span>

          <svg
            id="masterSvg"
            class="master-svg"
            data-focus="overview"
            viewBox="0 0 1240 370"
            role="img"
            aria-label="Credit Copilot Policy Ingestion and pgvector Architecture Diagram"
          >
            <defs>
              <linearGradient id="gEmeraldCard" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1b6b56" />
                <stop offset="100%" stop-color="#104437" />
              </linearGradient>
              <linearGradient id="gEmbedCard" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1f7b7a" />
                <stop offset="100%" stop-color="#124e52" />
              </linearGradient>
              <linearGradient id="gDbBody" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#228fa3" />
                <stop offset="100%" stop-color="#125565" />
              </linearGradient>
              <linearGradient id="gDbTop" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#36b8cc" />
                <stop offset="100%" stop-color="#2290a4" />
              </linearGradient>
              <marker
                id="arrowGreen"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6.5"
                markerHeight="6.5"
                orient="auto-start-reverse"
              >
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#5fe0b0" />
              </marker>
              <marker
                id="arrowTeal"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6.5"
                markerHeight="6.5"
                orient="auto-start-reverse"
              >
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#6ae0f2" />
              </marker>
              <marker
                id="arrowRed"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6.5"
                markerHeight="6.5"
                orient="auto-start-reverse"
              >
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff8a7d" />
              </marker>
            </defs>

            <!-- Background Pipeline Frame -->
            <g class="pipeline-frame" style="transition: opacity 0.4s ease">
              <rect
                x="236"
                y="20"
                width="712"
                height="276"
                rx="18"
                fill="rgba(16, 62, 50, 0.34)"
                stroke="rgba(110, 231, 191, 0.3)"
                stroke-width="1.5"
                stroke-dasharray="7 5"
              />
              <text
                x="256"
                y="45"
                fill="#7be6c1"
                font-size="12"
                font-weight="800"
                letter-spacing="1.4"
                font-family="monospace"
              >
                4-STAGE LIVE SSE INGESTION PIPELINE (POST /api/v1/knowledge/ingestions/streams)
              </text>
            </g>

            <!-- ===================================================== -->
            <!-- CONNECTING WIRES WITH ANIMATED FLOW                   -->
            <!-- ===================================================== -->
            <!-- Sources -> Extract -->
            <g class="diag-wire wire-src-ext">
              <path
                d="M192 84 C216 84, 218 156, 250 156"
                stroke="#5fe0b0"
                stroke-width="2.4"
                fill="none"
                class="flow-anim"
                marker-end="url(#arrowGreen)"
              />
              <path
                d="M192 156 H250"
                stroke="#5fe0b0"
                stroke-width="2.6"
                fill="none"
                class="flow-anim"
                marker-end="url(#arrowGreen)"
              />
              <path
                d="M192 228 C216 228, 218 156, 250 156"
                stroke="#5fe0b0"
                stroke-width="2.4"
                fill="none"
                class="flow-anim"
                marker-end="url(#arrowGreen)"
              />
            </g>

            <!-- Blocked Customer Pack -> Shield -->
            <g class="diag-wire wire-blocked">
              <path
                d="M192 318 H326 V266"
                stroke="#ff8a7d"
                stroke-width="2.2"
                stroke-dasharray="5 5"
                fill="none"
                marker-end="url(#arrowRed)"
              />
              <rect x="206" y="303" width="110" height="22" rx="6" fill="#471815" stroke="#ff8a7d" stroke-width="1" />
              <text x="261" y="318" text-anchor="middle" fill="#ffb8b0" font-size="10" font-weight="800" font-family="monospace">
                403 BLOCKED
              </text>
            </g>

            <!-- Extract -> Chunk -->
            <g class="diag-wire wire-ext-chk">
              <path
                d="M402 156 H430"
                stroke="#5fe0b0"
                stroke-width="2.8"
                fill="none"
                class="flow-anim"
                marker-end="url(#arrowGreen)"
              />
            </g>

            <!-- Chunk -> Embed -->
            <g class="diag-wire wire-chk-emb">
              <path
                d="M582 156 H610"
                stroke="#5fe0b0"
                stroke-width="2.8"
                fill="none"
                class="flow-anim"
                marker-end="url(#arrowGreen)"
              />
            </g>

            <!-- Embed -> Index -->
            <g class="diag-wire wire-emb-idx">
              <path
                d="M762 156 H790"
                stroke="#6ae0f2"
                stroke-width="2.8"
                fill="none"
                class="flow-anim"
                marker-end="url(#arrowTeal)"
              />
            </g>

            <!-- Index -> pgvector DB -->
            <g class="diag-wire wire-idx-db">

                body: 'Each chunk ID is <code>SHA-256(docId:docHash:version:ordinal:contentHash)</code>. Re-uploading an unchanged policy skips Embed &amp; Index immediately with <strong>0 API calls</strong>.',
                foot: 'Same ID + different hash → HTTP 409 Conflict',
              },
            ],
          },
          {
            focus: 'embed',
            pill: '3. Embed',
            eyebrow: 'STEP 05 OF 07 · STAGE 3 — VECTOR EMBEDDING',
            title: 'Spotlight: Dense Semantic Embeddings & Multi-Space Isolation',
            lead: 'Stage 3 maps each policy clause into a dense numeric vector so natural-language underwriting questions match relevant clauses by cosine geometry.',
            tag: 'Stage 3 · EmbeddingPort (768d)',
            cards: [
              {
                title: 'Meaning as Vector Coordinates',
                badge: 'Cosine Space',
                tone: 'is-teal',
                body: 'Encodes text with <code>task="document"</code> into dense float arrays (e.g. <code>[0.04, -0.19, 0.63…]</code>). Paraphrased queries like <em>"max debt burden"</em> land right next to <code>CP-4.1 (DBR 40%)</code>.',
                foot: 'Query-time PII masked before embedding',
              },
              {
                title: 'Strict Dimension Validation & SSE',
                badge: 'Live Progress',
                body: 'Streams per-chunk progress (<code>Embedded k of N</code>) to the browser. Every vector must match expected <code>dimensions</code> with finite numbers — failing cleanly with zero partial writes.',
                foot: 'DB constraint: CHECK(vector_dims = dimensions)',
              },
              {
                title: 'Gemini Cloud ↔ Local Ollama Safe',
                badge: 'Multi-Space PK',
                tone: 'is-amber',
                body: 'Composite key <code>PRIMARY KEY (chunk_id, model, dimensions)</code> lets multiple embedding models and vector sizes coexist cleanly in <code>knowledge.embeddings</code> without mixing spaces.',
                foot: 'Zero downtime when switching providers',
              },
            ],
          },
          {
            focus: 'index',
            pill: '4. Index',
            eyebrow: 'STEP 06 OF 07 · STAGE 4 — ATOMIC INDEX COMMIT',
            title: 'Spotlight: Concurrency Locking & Single-Transaction ACID Commit',
            lead: 'Stage 4 publishes documents, chunks, full-text search vectors, embeddings, and pricing rows atomically — ensuring the Vector DB is never left half-indexed.',
            tag: 'Stage 4 · ACID Transaction',
            cards: [
              {
                title: 'Per-Document Advisory Lock',
                badge: 'Concurrency Safe',
                body: 'Acquires <code>pg_advisory_xact_lock(hashtext(docId))</code> inside the transaction to serialize concurrent uploads for the same policy ID and re-verify hash conflicts.',
                foot: 'Prevents race conditions on parallel batches',
              },
              {
                title: 'All-or-Nothing Publishing',
                badge: 'Zero Partial Chunks',
                tone: 'is-teal',
                body: 'Writes <code>documents</code>, <code>index_revisions</code>, deactivates old rows, upserts active <code>chunks</code> + <code>embeddings</code> + <code>pricing</code>. If anything fails, PostgreSQL rolls back cleanly.',
                foot: 'Stored GENERATED tsvector updated automatically',
              },
              {
                title: 'Full Lifecycle Auditability',
                badge: 'Audit Trail',
                tone: 'is-amber',
                body: 'Records every attempt in <code>knowledge.ingestion_attempts</code> (<code>processing → succeeded | skipped | failed | deleted</code>) and supports full cascading policy deletion.',
                foot: 'DELETE /knowledge/documents/:id removes vectors',
              },
            ],
          },
          {
            focus: 'vectordb',
            pill: 'Vector DB',
            eyebrow: 'STEP 07 OF 07 · POSTGRESQL 17 + PGVECTOR RETRIEVAL',
            title: 'Spotlight: Inside knowledge.* & Hybrid Search (Cosine + BM25 + RRF)',
            lead: 'PostgreSQL + pgvector powers both semantic vector search and exact keyword BM25 inside one isolated schema — filtering by product and date before ranking.',
            tag: 'Hybrid: Cosine <=> + BM25 + RRF (k=60)',
            cards: [
              {
                title: 'Unified Schema, Isolated from PII',
                badge: 'knowledge.*',
                tone: 'is-teal',
                body: 'Holds <code>documents</code>, <code>chunks</code> (<code>GIN(search_vector)</code> + date B-tree), <code>embeddings</code> (<code>pgvector</code>), and <code>pricing</code> — zero foreign keys to customer <code>cases.*</code>.',
                foot: 'One ACID engine · no sync drift across DBs',
              },
              {
                title: 'Hard SQL Date & Product Filter',
                badge: 'Time-Travel Safe',
                body: 'An <code>eligible</code> CTE enforces <code>c.active</code>, <code>product = $2</code>, and <code>effective_from &lt;= asOfDate &lt; effective_to</code> <em>before</em> scoring — expired policies (<code>CP-2024</code>) can never leak.',
                foot: 'B-tree index: (product, effective_from, to)',
              },
              {
                title: 'Reciprocal Rank Fusion (RRF)',
                badge: 'k=60 · Single SQL',
                tone: 'is-amber',
                body: 'Fuses Top-20 <strong>pgvector Cosine</strong> (<code>1 - (embedding &lt;=&gt; $1)</code>) + Top-20 in-SQL <strong>Okapi BM25</strong> (<code>k1=1.2, b=0.75</code>) via <code>1/(60+rV) + 1/(60+rB)</code> + optional similarity-floored rewrite.',
                foot: 'Catches both paraphrases & exact clause IDs',
              },
            ],
          },
        ];

        const masterSvg = document.getElementById('masterSvg');
        const stepEyebrow = document.getElementById('stepEyebrow');
        const slideTitle = document.getElementById('slideTitle');
        const detailPanel = document.getElementById('detailPanel');
        const stagePillsWrap = document.getElementById('stagePills');
        const dotsWrap = document.getElementById('dots');
        const counter = document.getElementById('counter');
        const progressFill = document.getElementById('progressFill');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnFs = document.getElementById('btnFs');

        let current = 0;

        // Build top pills & bottom dots
        STEPS.forEach((step, idx) => {
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'stage-pill';
          pill.textContent = step.pill;
          pill.addEventListener('click', () => goTo(idx));
          stagePillsWrap.appendChild(pill);

          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'dot-btn';
          dot.title = `${idx + 1}. ${step.pill}`;
          dot.setAttribute('aria-label', `Go to step ${idx + 1}: ${step.pill}`);
          dot.addEventListener('click', () => goTo(idx));
          dotsWrap.appendChild(dot);
        });

        const pills = Array.from(stagePillsWrap.querySelectorAll('.stage-pill'));
        const dots = Array.from(dotsWrap.querySelectorAll('.dot-btn'));

        // Clickable SVG diagram nodes jump directly to their slide
        document.querySelectorAll('[data-jump]').forEach((node) => {
          const jumpIndex = Number(node.getAttribute('data-jump'));
          node.addEventListener('click', () => goTo(jumpIndex));
          node.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              goTo(jumpIndex);
            }
          });
        });

        function renderDetail(step) {
          // Re-trigger smooth fade-up animation
          detailPanel.style.animation = 'none';
          void detailPanel.offsetHeight;
          detailPanel.style.animation = '';

          const cardsHtml = step.cards
            .map(
              (c) => `
              <article class="d-card ${c.tone || ''}">
                <div class="d-card-head">
                  <h3>${c.title}</h3>
                  <span class="d-card-badge">${c.badge}</span>
                </div>
                <p>${c.body}</p>
                <div class="d-card-foot">${c.foot}</div>
              </article>
            `,
            )
            .join('');

          detailPanel.innerHTML = `
            <div class="detail-lead">
              <p>${step.lead}</p>
              <span class="detail-tag">${step.tag}</span>
            </div>
            <div class="detail-cards${step.fourCols ? ' is-four' : ''}">
              ${cardsHtml}
            </div>
          `;
        }

        function goTo(index) {
          const next = Math.max(0, Math.min(STEPS.length - 1, index));
          current = next;
          const step = STEPS[current];

          masterSvg.setAttribute('data-focus', step.focus);
          stepEyebrow.textContent = step.eyebrow;
          slideTitle.textContent = step.title;
          renderDetail(step);

          pills.forEach((p, idx) => p.classList.toggle('is-active', idx === current));
          dots.forEach((d, idx) => d.classList.toggle('is-active', idx === current));
          counter.textContent = `${String(current + 1).padStart(2, '0')} / ${String(STEPS.length).padStart(2, '0')}`;
          progressFill.style.width = `${((current + 1) / STEPS.length) * 100}%`;
          btnPrev.disabled = current === 0;
          btnNext.disabled = current === STEPS.length - 1;
        }

        btnPrev.addEventListener('click', () => goTo(current - 1));
        btnNext.addEventListener('click', () => goTo(current + 1));

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.().catch(() => {});
          }
        }
        btnFs.addEventListener('click', toggleFullscreen);

        window.addEventListener('keydown', (e) => {
          if (e.target instanceof HTMLButtonElement && e.key === ' ') return;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault();
            goTo(current + 1);
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
            e.preventDefault();
            goTo(current - 1);
          } else if (e.key === 'f' || e.key === 'F') {
            toggleFullscreen();
          } else if (e.key >= '1' && e.key <= String(STEPS.length)) {
            goTo(Number(e.key) - 1);
          }
        });

        goTo(0);
      })();
    </script>
  </body>
</html>
