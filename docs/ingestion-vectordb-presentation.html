<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Copilot — Policy Ingestion &amp; Vector DB</title>
    <style>
      :root {
        --bg-outer: #061713;
        --bg-stage-1: #0a241e;
        --bg-stage-2: #0f342b;
        --ink: #f0faf6;
        --ink-soft: #c5e3d8;
        --muted: #84b3a3;
        --emerald: #176753;
        --emerald-bright: #34d399;
        --amber-bright: #fbbf24;
        --cyan-bright: #38bdf8;
        --mint-bright: #4ade80;
        --red-bright: #fb7185;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --sans: Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg-outer);
        -webkit-font-smoothing: antialiased;
      }

      .deck {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 20px 62px;
        background:
          radial-gradient(circle at 14% 12%, rgba(36, 152, 121, 0.22), transparent 42%),
          radial-gradient(circle at 86% 86%, rgba(45, 169, 190, 0.18), transparent 44%),
          var(--bg-outer);
      }

      .stage {
        position: relative;
        width: min(100%, 1420px);
        height: min(100%, 790px);
        border-radius: 20px;
        background:
          radial-gradient(circle at 75% 18%, rgba(52, 211, 153, 0.12), transparent 44%),
          radial-gradient(circle at 18% 84%, rgba(56, 189, 248, 0.1), transparent 46%),
          linear-gradient(145deg, var(--bg-stage-1) 0%, var(--bg-stage-2) 55%, #0a2720 100%);
        border: 1px solid rgba(118, 224, 188, 0.18);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.56),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        padding: 20px 30px 18px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 14px;
        overflow: hidden;
      }

      /* Minimal Top Header */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }

      .brand-block {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .step-label {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--emerald-bright);
        margin-bottom: 2px;
      }

      .slide-title {
        margin: 0;
        font-size: clamp(20px, 2.1vw, 27px);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: #f5fdf9;
      }

      .stage-pills {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .stage-pill {
        appearance: none;
        border: 1px solid rgba(139, 224, 194, 0.2);
        background: rgba(255, 255, 255, 0.04);
        color: #9ecbbe;
        border-radius: 999px;
        padding: 5px 12px;
        font: inherit;
        font-size: 11.5px;
        font-weight: 650;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .stage-pill:hover {
        background: rgba(52, 211, 153, 0.14);
        border-color: rgba(110, 231, 191, 0.5);
        color: #fff;
      }

      .stage-pill.is-active {
        background: #176753;
        border-color: #6ee7bf;
        color: #ffffff;
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.22);
      }

      /* Giant Clean Master Diagram Canvas */
      .diagram-shell {
        position: relative;
        min-height: 0;
        border-radius: 16px;
        background:
          radial-gradient(circle at 50% 48%, rgba(25, 112, 90, 0.16), transparent 68%),
          rgba(5, 18, 15, 0.68);
        border: 1px solid rgba(110, 231, 191, 0.16);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .master-svg {
        width: 100%;
        height: 100%;
        max-height: 100%;
        display: block;
      }

      /* SVG Spotlight System — Crisp Vivid Focus vs Calm Dimmed Context */
      .diag-node {
        cursor: pointer;
        opacity: 1;
        transition:
          opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.4s ease;
        transform-box: fill-box;
        transform-origin: center;
      }

      .diag-node:hover {
        filter: brightness(1.1);
      }

      .diag-wire {
        opacity: 0.9;
        transition: opacity 0.4s ease;
      }

      .pipeline-frame {
        transition:
          opacity 0.4s ease,
          stroke 0.4s ease;
      }

      .spotlight-ring {
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }

      .active-overlay {
        opacity: 0;
        transition: opacity 0.38s ease;
        pointer-events: none;
      }

      /* When ANY focused step is active, smoothly dim unfocused items */
      .master-svg.is-focused .diag-node {
        opacity: 0.18;
        filter: saturate(0.2) brightness(0.8);
      }

      .master-svg.is-focused .diag-wire {
        opacity: 0.12;
      }

      .master-svg.is-focused .pipeline-frame {
        opacity: 0.25;
      }

      /* Focused stage pops at 100% opacity, vivid color boost, scale & luminous halo */
      .master-svg.is-focused[data-focus='sources'] .diag-node.node-sources {
        opacity: 1;
        transform: scale(1.04);
        filter: saturate(1.3) brightness(1.12) drop-shadow(0 0 22px rgba(52, 211, 153, 0.55));
      }

      .master-svg.is-focused[data-focus='extract'] .diag-node.node-extract {
        opacity: 1;
        transform: scale(1.055);
        filter: saturate(1.35) brightness(1.15) drop-shadow(0 0 24px rgba(52, 211, 153, 0.6));
      }

      .master-svg.is-focused[data-focus='chunk'] .diag-node.node-chunk {
        opacity: 1;
        transform: scale(1.055);
        filter: saturate(1.35) brightness(1.15) drop-shadow(0 0 24px rgba(251, 191, 36, 0.55));
      }

      .master-svg.is-focused[data-focus='embed'] .diag-node.node-embed {
        opacity: 1;
        transform: scale(1.055);
        filter: saturate(1.35) brightness(1.15) drop-shadow(0 0 24px rgba(56, 189, 248, 0.62));
      }

      .master-svg.is-focused[data-focus='index'] .diag-node.node-index {
        opacity: 1;
        transform: scale(1.055);
        filter: saturate(1.35) brightness(1.15) drop-shadow(0 0 24px rgba(74, 222, 128, 0.6));
      }

      .master-svg.is-focused[data-focus='vectordb'] .diag-node.node-vectordb {
        opacity: 1;
        transform: scale(1.045);
        filter: saturate(1.35) brightness(1.14) drop-shadow(0 0 26px rgba(56, 189, 248, 0.62));
      }

      /* Show glowing spotlight ring + vivid color tint overlay on the selected node */
      .master-svg.is-focused[data-focus='sources'] .node-sources .spotlight-ring,
      .master-svg.is-focused[data-focus='extract'] .node-extract .spotlight-ring,
      .master-svg.is-focused[data-focus='chunk'] .node-chunk .spotlight-ring,
      .master-svg.is-focused[data-focus='embed'] .node-embed .spotlight-ring,
      .master-svg.is-focused[data-focus='index'] .node-index .spotlight-ring,
      .master-svg.is-focused[data-focus='vectordb'] .node-vectordb .spotlight-ring,
      .master-svg.is-focused[data-focus='extract'] .node-extract .active-overlay,
      .master-svg.is-focused[data-focus='chunk'] .node-chunk .active-overlay,
      .master-svg.is-focused[data-focus='embed'] .node-embed .active-overlay,
      .master-svg.is-focused[data-focus='index'] .node-index .active-overlay {
        opacity: 1;
      }

      /* Light up active arrows entering & leaving the focused node */
      .master-svg.is-focused[data-focus='sources'] .diag-wire.wire-src-ext,
      .master-svg.is-focused[data-focus='sources'] .diag-wire.wire-blocked,
      .master-svg.is-focused[data-focus='extract'] .diag-wire.wire-src-ext,
      .master-svg.is-focused[data-focus='extract'] .diag-wire.wire-blocked,
      .master-svg.is-focused[data-focus='extract'] .diag-wire.wire-ext-chk,
      .master-svg.is-focused[data-focus='chunk'] .diag-wire.wire-ext-chk,
      .master-svg.is-focused[data-focus='chunk'] .diag-wire.wire-chk-emb,
      .master-svg.is-focused[data-focus='embed'] .diag-wire.wire-chk-emb,
      .master-svg.is-focused[data-focus='embed'] .diag-wire.wire-emb-idx,
      .master-svg.is-focused[data-focus='index'] .diag-wire.wire-emb-idx,
      .master-svg.is-focused[data-focus='index'] .diag-wire.wire-idx-db,
      .master-svg.is-focused[data-focus='vectordb'] .diag-wire.wire-idx-db {
        opacity: 1;
      }

      @keyframes dashFlow {
        from {
          stroke-dashoffset: 36;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      .flow-anim {
        stroke-dasharray: 8 7;
        animation: dashFlow 1.2s linear infinite;
      }

      @keyframes ringPulse {
        0%,
        100% {
          stroke-opacity: 1;
          stroke-width: 3;
        }
        50% {
          stroke-opacity: 0.45;
          stroke-width: 4.5;
        }
      }

      .spotlight-ring {
        animation: ringPulse 2s ease-in-out infinite;
      }

      /* Ultra-Clean Bottom Rules Strip (Zero Repetition) */
      .rules-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        animation: stripIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes stripIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .rule-card {
        background: rgba(7, 25, 20, 0.72);
        border: 1px solid rgba(110, 231, 191, 0.22);
        border-top: 3px solid var(--rule-accent, #34d399);
        border-radius: 12px;
        padding: 13px 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .rule-card h3 {
        margin: 0;
        font-size: 13.8px;
        font-weight: 750;
        color: #f4fcf9;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .rule-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--rule-accent, #34d399);
        flex: none;
      }

      .rule-card p {
        margin: 0;
        font-size: 12.6px;
        line-height: 1.48;
        color: #c1ded4;
      }

      .rule-card code {
        font-family: var(--mono);
        font-size: 11.4px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        color: #9df3d2;
      }

      /* Progress bar */
      .progress-rail {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #34d399, #38bdf8);
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Presenter Controls */
      .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(8, 27, 22, 0.92);
        border: 1px solid rgba(139, 224, 194, 0.24);
        backdrop-filter: blur(12px);
        color: #dff5ed;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
      }

      .nav-btn {
        width: 31px;
        height: 31px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: #eefaf5;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      .nav-btn:hover:not(:disabled) {
        background: #176753;
        border-color: #6ee7bf;
      }

      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot-btn {
        width: 9px;
        height: 9px;
        padding: 0;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 255, 255, 0.26);
        cursor: pointer;
        transition:
          width 0.22s ease,
          background 0.22s ease;
      }

      .dot-btn.is-active {
        width: 24px;
        background: #34d399;
      }

      .counter {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: #a9d9c8;
        min-width: 52px;
        text-align: center;
      }

      @media (max-width: 1000px) {
        .stage {
          padding: 16px;
          grid-template-rows: auto auto auto;
          overflow-y: auto;
        }
        .rules-strip {
          grid-template-columns: 1fr;
        }
        .stage-pills {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="deck" aria-label="Credit Copilot Ingestion and Vector DB Presentation">
      <div class="stage">
        <!-- Header -->
        <header class="topbar">
          <div class="brand-block">
            <svg width="38" height="38" viewBox="0 0 36 36" fill="none" aria-hidden="true">
              <rect width="36" height="36" rx="10" fill="#176753" />
              <path d="M18 7L29 12.5H7L18 7Z" fill="#E8F7F1" />
              <rect x="8.5" y="14" width="19" height="1.8" rx="0.9" fill="#9EE2C8" />
              <rect x="10.2" y="17.2" width="2.4" height="8.8" rx="0.8" fill="#E8F7F1" />
              <rect x="16.8" y="17.2" width="2.4" height="8.8" rx="0.8" fill="#E8F7F1" />
              <rect x="23.4" y="17.2" width="2.4" height="8.8" rx="0.8" fill="#E8F7F1" />
              <rect x="7" y="27.2" width="22" height="2.3" rx="1.15" fill="#34D399" />
            </svg>
            <div>
              <div class="step-label" id="stepLabel">01 / 07 · OVERVIEW</div>
              <h1 class="slide-title" id="slideTitle">Policy Ingestion &amp; Vector Database</h1>
            </div>
          </div>
          <div class="stage-pills" id="stagePills" role="tablist" aria-label="Jump to stage"></div>
        </header>

        <!-- Giant Clean Master Diagram -->
        <section class="diagram-shell" aria-label="Interactive Ingestion and Vector DB Diagram">
          <svg
            id="masterSvg"
            class="master-svg"
            data-focus="overview"
            viewBox="0 0 1260 400"
            role="img"
            aria-label="Policy Ingestion Pipeline into PostgreSQL pgvector"
          >
            <defs>
              <linearGradient id="gExtract" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#19785f" />
                <stop offset="100%" stop-color="#0f4c3c" />
              </linearGradient>
              <linearGradient id="gChunk" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8a6116" />
                <stop offset="100%" stop-color="#52380c" />
              </linearGradient>
              <linearGradient id="gEmbed" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#157091" />
                <stop offset="100%" stop-color="#0d445c" />
              </linearGradient>
              <linearGradient id="gIndex" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1c7d4d" />
                <stop offset="100%" stop-color="#0f4d2f" />
              </linearGradient>
              <linearGradient id="gDbBody" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1e89a8" />
                <stop offset="100%" stop-color="#0f4e63" />
              </linearGradient>
              <linearGradient id="gDbTop" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#1f8aa8" />
              </linearGradient>
              <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#34d399" />
              </marker>
              <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#fbbf24" />
              </marker>
              <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#38bdf8" />
              </marker>
              <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
                <path d="M1 1.5L8.5 5L1 8.5Z" fill="#fb7185" />
              </marker>
            </defs>

            <!-- Pipeline Container Outline -->
            <g class="pipeline-frame">
              <rect
                x="236"
                y="24"
                width="724"
                height="286"
                rx="20"
                fill="rgba(14, 54, 43, 0.3)"
                stroke="rgba(110, 231, 191, 0.28)"
                stroke-width="1.5"
                stroke-dasharray="7 5"
              />
              <text
                x="258"
                y="51"
                fill="#7be6c1"
                font-size="12.5"
                font-weight="800"
                letter-spacing="1.4"
                font-family="monospace"
              >
                LIVE 4-STAGE INGESTION PIPELINE
              </text>
            </g>

            <!-- ===================================================== -->
            <!-- ANIMATED FLOW ARROWS                                  -->
            <!-- ===================================================== -->
            <g class="diag-wire wire-src-ext">
              <path d="M196 90 C220 90, 222 170, 252 170" stroke="#34d399" stroke-width="2.6" fill="none" class="flow-anim" marker-end="url(#arrGreen)" />
              <path d="M196 170 H252" stroke="#34d399" stroke-width="2.8" fill="none" class="flow-anim" marker-end="url(#arrGreen)" />
              <path d="M196 250 C220 250, 222 170, 252 170" stroke="#34d399" stroke-width="2.6" fill="none" class="flow-anim" marker-end="url(#arrGreen)" />
            </g>

            <g class="diag-wire wire-blocked">
              <path d="M196 344 H332 V290" stroke="#fb7185" stroke-width="2.4" stroke-dasharray="5 5" fill="none" marker-end="url(#arrRed)" />
              <rect x="208" y="330" width="112" height="24" rx="7" fill="#4c131d" stroke="#fb7185" stroke-width="1.2" />
              <text x="264" y="346" text-anchor="middle" fill="#fecdd3" font-size="10.5" font-weight="800" font-family="monospace">
                403 BLOCKED
              </text>
            </g>

            <g class="diag-wire wire-ext-chk">
              <path d="M408 170 H438" stroke="#fbbf24" stroke-width="3" fill="none" class="flow-anim" marker-end="url(#arrAmber)" />
            </g>

            <g class="diag-wire wire-chk-emb">
              <path d="M590 170 H620" stroke="#38bdf8" stroke-width="3" fill="none" class="flow-anim" marker-end="url(#arrCyan)" />
            </g>

            <g class="diag-wire wire-emb-idx">
              <path d="M772 170 H802" stroke="#34d399" stroke-width="3" fill="none" class="flow-anim" marker-end="url(#arrGreen)" />
            </g>

            <g class="diag-wire wire-idx-db">
              <path d="M948 170 H996" stroke="#38bdf8" stroke-width="3.2" fill="none" class="flow-anim" marker-end="url(#arrCyan)" />
            </g>

            <!-- ===================================================== -->
            <!-- NODE 1: POLICY SOURCES                                -->
            <!-- ===================================================== -->
            <g class="diag-node node-sources" data-jump="1" tabindex="0" role="button" aria-label="Focus Policy Sources">
              <rect class="spotlight-ring" x="10" y="42" width="194" height="338" rx="18" fill="none" stroke="#34d399" />
              <text x="107" y="34" text-anchor="middle" fill="#8de3c4" font-size="12" font-weight="800" font-family="monospace">
                SOURCES
              </text>

              <rect x="20" y="54" width="174" height="68" rx="13" fill="#113e33" stroke="#34d399" stroke-width="1.6" />
              <rect x="32" y="70" width="42" height="28" rx="7" fill="#10b981" />
              <text x="53" y="88" text-anchor="middle" fill="#052e22" font-size="11.5" font-weight="900" font-family="monospace">PDF</text>
              <text x="84" y="83" fill="#f2fcf8" font-size="14" font-weight="750">Policies</text>
              <text x="84" y="103" fill="#9bd6c2" font-size="11" font-family="monospace">CP · PM</text>

              <rect x="20" y="136" width="174" height="68" rx="13" fill="#103945" stroke="#38bdf8" stroke-width="1.6" />
              <rect x="32" y="152" width="42" height="28" rx="7" fill="#38bdf8" />
              <text x="53" y="170" text-anchor="middle" fill="#062938" font-size="11.5" font-weight="900" font-family="monospace">MD</text>
              <text x="84" y="165" fill="#f2fcf8" font-size="14" font-weight="750">Circulars</text>
              <text x="84" y="185" fill="#9cd8e8" font-size="11" font-family="monospace">Sheets</text>

              <rect x="20" y="218" width="174" height="68" rx="13" fill="#163e2d" stroke="#4ade80" stroke-width="1.6" />
              <rect x="32" y="234" width="42" height="28" rx="7" fill="#4ade80" />

    <script>
      (() => {
        const STEPS = [
          {
            focus: 'overview',
            pill: 'Overview',
            label: '01 / 07 · ARCHITECTURE OVERVIEW',
            title: 'Policy Ingestion & Vector Database',
            accent: '#34d399',
            rules: [
              {
                title: 'Zero PII Contamination',
                text: 'Customer evidence stays in <code>cases.*</code> and is cryptographically blocked from entering <code>knowledge.*</code>.',
              },
              {
                title: 'Dated & Idempotent',
                text: 'Every policy chunk carries <code>effective_from/to</code> dates and a deterministic SHA-256 ID.',
              },
              {
                title: 'Single ACID Engine',
                text: 'PostgreSQL 17 + pgvector serves Cosine search, BM25 full-text, and exact Decimal pricing together.',
              },
            ],
          },
          {
            focus: 'sources',
            pill: 'Sources',
            label: '02 / 07 · POLICY SOURCES & FIREWALL',
            title: 'Input Corpus & Zero-Trust Gate',
            accent: '#34d399',
            rules: [
              {
                title: 'Strict Upload Limits',
                text: 'Accepts <code>PDF</code> (≤100 pages, text layer only), <code>MD</code> &amp; <code>CSV</code> — max <strong>10 MiB</strong>, 1–20 files/batch.',
              },
              {
                title: 'Customer Pack Firewall (403)',
                text: 'Rejects <code>APP-*</code>/<code>AUTO-*</code>, excluded SHA-256 hashes &amp; customer evidence markers before parsing proceeds.',
                accent: '#fb7185',
              },
              {
                title: 'Server-Enforced RBAC',
                text: 'Only <code>head-credit</code> (<code>can_ingest = true</code>) may upload or delete policy documents.',
              },
            ],
          },
          {
            focus: 'extract',
            pill: '1. Extract',
            label: '03 / 07 · STAGE 1 — EXTRACT',
            title: 'Stage 1: Extraction & Auto-Metadata',
            accent: '#34d399',
            rules: [
              {
                title: 'Byte & Encoding Safety',
                text: 'Verifies <code>%PDF-</code> signature, MIME match &amp; UTF-8, normalizes via <code>NFKC</code>, and hashes with <code>SHA-256</code>.',
              },
              {
                title: '3-Tier Metadata Resolution',
                text: 'Matches SHA-256 manifest first → reads PDF/MD/CSV headers automatically → merges optional overrides.',
              },
              {
                title: 'Validity Guard (422 / 403)',
                text: 'Requires <code>effectiveTo &gt; effectiveFrom</code> and rejects untagged non-policy files without edition/date.',
              },
            ],
          },
          {
            focus: 'chunk',
            pill: '2. Chunk',
            label: '04 / 07 · STAGE 2 — CHUNK',
            title: 'Stage 2: Clause-Aware Chunking',
            accent: '#fbbf24',
            rules: [
              {
                title: 'Banking Clause Boundaries',
                text: 'Splits at <code>CP-*</code>, <code>PM-*</code>, <code>PS-*</code>, <code>C-*</code> &amp; CSV rows — keeps comparison tables intact.',
              },
              {
                title: 'Token Budget (cl100k_base)',
                text: 'Clauses ≤ <strong>800 tokens</strong> stay whole; oversized sections split cleanly with a <strong>60-token</strong> overlap.',
              },
              {
                title: 'Zero-Waste Idempotency',
                text: '<code>SHA-256(docId:hash:v3:ordinal:text)</code> skips Embed &amp; Index on unchanged re-uploads (0 API cost).',
              },
            ],
          },
          {
            focus: 'embed',
            pill: '3. Embed',
            label: '05 / 07 · STAGE 3 — EMBED',
            title: 'Stage 3: Dense Vector Embeddings',
            accent: '#38bdf8',
            rules: [
              {
                title: 'Semantic Vector Space',
                text: 'Encodes each clause (<code>task="document"</code>) into a <strong>768d</strong> vector so paraphrases match by cosine angle.',
              },
              {
                title: 'Strict Dimension Check',
                text: 'Validates <code>vector_dims(embedding) = dimensions</code> &amp; finite floats while streaming live SSE progress.',
              },
              {
                title: 'Multi-Provider Isolation',
                text: '<code>PRIMARY KEY (chunk_id, model, dimensions)</code> lets Gemini cloud &amp; local Ollama coexist safely.',
              },
            ],
          },
          {
            focus: 'index',
            pill: '4. Index',
            label: '06 / 07 · STAGE 4 — INDEX',
            title: 'Stage 4: Atomic ACID Commit',
            accent: '#4ade80',
            rules: [
              {
                title: 'Per-Document Advisory Lock',
                text: '<code>pg_advisory_xact_lock</code> prevents race conditions; same ID with different bytes returns <code>409</code>.',
              },
              {
                title: 'All-or-Nothing Publishing',
                text: 'Commits documents, chunks, stored <code>tsvector</code>, vectors &amp; pricing in one transaction — zero partial indexes.',
              },
              {
                title: 'Full Audit &amp; Clean Delete',
                text: 'Logs every attempt in <code>ingestion_attempts</code>; deleting a policy cascades cleanly across chunks &amp; vectors.',
              },
            ],
          },
          {
            focus: 'vectordb',
            pill: 'Vector DB',
            label: '07 / 07 · POSTGRESQL + PGVECTOR',
            title: 'Hybrid Retrieval inside knowledge.*',
            accent: '#38bdf8',
            rules: [
              {
                title: 'Hard SQL Date &amp; Product Filter',
                text: 'Filters <code>active</code>, <code>product</code> &amp; <code>effective_from/to</code> <em>before</em> scoring — expired policies never leak.',
              },
              {
                title: 'Hybrid RRF Fusion (k=60)',
                text: 'Merges Top-20 pgvector Cosine (<code>&lt;=&gt;</code>) + Top-20 GIN Okapi BM25 (<code>k1=1.2, b=0.75</code>) in one SQL snapshot.',
              },
              {
                title: 'Zero-Hallucination Math',
                text: 'Rate CSVs live in <code>knowledge.pricing</code> for exact 50-digit Decimal calculations — never LLM guesswork.',
              },
            ],
          },
        ];

        const masterSvg = document.getElementById('masterSvg');
        const stepLabel = document.getElementById('stepLabel');
        const slideTitle = document.getElementById('slideTitle');
        const rulesStrip = document.getElementById('rulesStrip');
        const stagePillsWrap = document.getElementById('stagePills');
        const dotsWrap = document.getElementById('dots');
        const counter = document.getElementById('counter');
        const progressFill = document.getElementById('progressFill');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnFs = document.getElementById('btnFs');

        let current = 0;

        STEPS.forEach((step, idx) => {
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'stage-pill';
          pill.textContent = step.pill;
          pill.addEventListener('click', () => goTo(idx));
          stagePillsWrap.appendChild(pill);

          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'dot-btn';
          dot.title = `${idx + 1}. ${step.pill}`;
          dot.setAttribute('aria-label', `Go to slide ${idx + 1}: ${step.pill}`);
          dot.addEventListener('click', () => goTo(idx));
          dotsWrap.appendChild(dot);
        });

        const pills = Array.from(stagePillsWrap.querySelectorAll('.stage-pill'));
        const dots = Array.from(dotsWrap.querySelectorAll('.dot-btn'));

        document.querySelectorAll('[data-jump]').forEach((node) => {
          const jumpIndex = Number(node.getAttribute('data-jump'));
          node.addEventListener('click', () => goTo(jumpIndex));
          node.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              goTo(jumpIndex);
            }
          });
        });

        function renderRules(step) {
          rulesStrip.style.animation = 'none';
          void rulesStrip.offsetHeight;
          rulesStrip.style.animation = '';
          rulesStrip.innerHTML = step.rules
            .map((r) => {
              const accent = r.accent || step.accent;
              return `
                <article class="rule-card" style="--rule-accent: ${accent}">
                  <h3><span class="rule-dot"></span>${r.title}</h3>
                  <p>${r.text}</p>
                </article>
              `;
            })
            .join('');
        }

        function goTo(index) {
          current = Math.max(0, Math.min(STEPS.length - 1, index));
          const step = STEPS[current];

          masterSvg.setAttribute('data-focus', step.focus);
          masterSvg.classList.toggle('is-focused', step.focus !== 'overview');
          stepLabel.textContent = step.label;
          stepLabel.style.color = step.accent;
          slideTitle.textContent = step.title;
          renderRules(step);

          pills.forEach((p, idx) => p.classList.toggle('is-active', idx === current));
          dots.forEach((d, idx) => d.classList.toggle('is-active', idx === current));
          counter.textContent = `${String(current + 1).padStart(2, '0')} / ${String(STEPS.length).padStart(2, '0')}`;
          progressFill.style.width = `${((current + 1) / STEPS.length) * 100}%`;
          btnPrev.disabled = current === 0;
          btnNext.disabled = current === STEPS.length - 1;
        }

        btnPrev.addEventListener('click', () => goTo(current - 1));
        btnNext.addEventListener('click', () => goTo(current + 1));

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.().catch(() => {});
          }
        }
        btnFs.addEventListener('click', toggleFullscreen);

        window.addEventListener('keydown', (e) => {
          if (e.target instanceof HTMLButtonElement && e.key === ' ') return;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault();
            goTo(current + 1);
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
            e.preventDefault();
            goTo(current - 1);
          } else if (e.key === 'f' || e.key === 'F') {
            toggleFullscreen();
          } else if (e.key >= '1' && e.key <= String(STEPS.length)) {
            goTo(Number(e.key) - 1);
          }
        });

        goTo(0);
      })();
    </script>
